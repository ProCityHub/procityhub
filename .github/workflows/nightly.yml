name: GARVIS Nightly Self-Test Agent

on:
  schedule:
    # Nightly at 08:00 UTC (02:00 Mountain Time)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Full System Self-Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict \
            --agent nightly \
            --label "nightly-${{ github.run_id }}" \
            --predicted 1.0 \
            --confidence 0.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run self-test
        id: selftest
        working-directory: genesis-x
        run: |
          python brain.py > self-test.json 2>&1
          STATUS=$(python3 -c "import json; print(json.load(open('self-test.json'))['SELF_TEST'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "## GARVIS Self-Test" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $STATUS" >> $GITHUB_STEP_SUMMARY

      - name: Run full test suite
        id: pytest
        working-directory: genesis-x
        run: |
          pytest tests/ -v --tb=short > test-output.txt 2>&1
          echo "## Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -5 test-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run CSV evaluation
        working-directory: genesis-x
        run: |
          python brain.py examples/sample_data.csv > csv-eval.json 2>&1
          STATUS=$(python3 -c "import json; print(json.load(open('csv-eval.json'))['score']['status'])")
          echo "## CSV Falsification Result" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** \`$STATUS\`" >> $GITHUB_STEP_SUMMARY

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 GARVIS Nightly Self-Test FAILED — ' + new Date().toISOString().split('T')[0],
              body: [
                '## GARVIS Nightly Agent Report',
                '',
                'The nightly self-test or test suite has failed.',
                '',
                '**Self-test status:** ${{ steps.selftest.outputs.status }}',
                '',
                '### Action Required',
                '',
                '1. Check the [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
                '2. Identify the failing test',
                '3. Fix and push',
                '',
                '---',
                'Generated by GARVIS Nightly Agent'
              ].join('\n'),
              labels: ['nightly-failure', 'garvis', 'automated']
            })

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: |
            genesis-x/self-test.json
            genesis-x/csv-eval.json
            genesis-x/test-output.txt
          retention-days: 90

      - name: Brain gate — observe & falsify
        if: always()
        run: |
          python3 ci-fix-bot/brain_gate.py observe \
            --agent nightly \
            --label "nightly-${{ github.run_id }}" \
            --observed 1.0 || true
          python3 ci-fix-bot/brain_gate.py falsify --agent nightly || true
          python3 ci-fix-bot/brain_gate.py summary --agent nightly || true
