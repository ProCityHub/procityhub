name: GARVIS Release Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0). Leave empty for auto-generated.'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish GARVIS Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest build

      - name: Run self-test
        working-directory: genesis-x
        run: python brain.py

      - name: Run test suite
        working-directory: genesis-x
        run: pytest tests/ -v

      - name: Build package
        working-directory: genesis-x
        run: python -m build

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by tag push — use the tag
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Manual trigger — use input or auto-generate
            TAG="${{ github.event.inputs.version }}"
            if [ -z "$TAG" ]; then
              TAG="v0.$(date +%Y%m%d).$(git rev-parse --short HEAD)"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            genesis-x/dist/*.whl
            genesis-x/dist/*.tar.gz
          body: |
            ## GARVIS / Genesis X Release

            **System:** GARVIS / Genesis X
            **Creator:** Adrien D. Thomas / ProCityHub
            **Epistemic Boundary:** NOT_ESTABLISHED for AGI or consciousness

            ### What's included
            - Genesis X Double-Slit OAB Falsification Brain
            - 13 pytest tests (all passing)
            - Interactive double-slit visualization
            - GARVIS Body Without Brain architecture (Directive BASE44_001)

            ### Install
            ```bash
            pip install genesis-x-*.whl
            python -m genesis_x.brain
            ```

            ---
            Mathematical consistency and software PASS do not establish physical truth.
