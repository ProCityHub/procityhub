name: GARVIS CI — Test Agent

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Brain Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Brain gate — predict
        run: |
          python3 ci-fix-bot/brain_gate.py predict \
            --agent test-agent \
            --label "test-${{ github.run_id }}" \
            --predicted 1.0 \
            --confidence 0.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run GARVIS self-test
        working-directory: genesis-x
        run: python brain.py

      - name: Run pytest suite (13 tests)
        working-directory: genesis-x
        run: pytest tests/ -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: genesis-x/.pytest_cache/
          retention-days: 7
      - name: Brain gate — observe & falsify
        if: always()
        run: |
          python3 ci-fix-bot/brain_gate.py observe \
            --agent test-agent \
            --label "test-${{ github.run_id }}" \
            --observed "${{ (job.status == 'success' && 1.0) || 0.0 }}" || true
          python3 ci-fix-bot/brain_gate.py falsify --agent test-agent || true
